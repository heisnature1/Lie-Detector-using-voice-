services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: voicestress-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: voicestress-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
